name: Python SDK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheel:
    name: Wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux2014 x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"

    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: packages/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: "1.12.5"
          rust-toolchain: "1.92.0"
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: packages/python/dist/*.whl
          if-no-files-found: error
      - name: Verify wheel import
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall packages/python/dist/*.whl
          python -c 'from xp3_brute import Xp3; assert Xp3.detect_filter()["backend"] == "ArchiveOnly"'

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: packages/python
          maturin-version: "1.12.5"
          rust-toolchain: "1.92.0"
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: packages/python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/xp3-brute
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
